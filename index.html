
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamu Jiva | Ancestral Vitality</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        html, body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F2ED;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100%;
            color: #2D4F3E;
        }
        #root {
            min-height: 100vh;
        }
        .font-serif {
            font-family: 'Fraunces', serif;
        }
        .grainy-texture::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("https://www.transparenttextures.com/patterns/p6.png");
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
        }
        /* Custom scrollbar for premium feel */
        ::-webkit-scrollbar {
          width: 8px;
        }
        ::-webkit-scrollbar-track {
          background: #F5F2ED;
        }
        ::-webkit-scrollbar-thumb {
          background: #2D4F3E;
          border-radius: 10px;
        }
        html {
            scroll-behavior: smooth;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="grainy-texture">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
